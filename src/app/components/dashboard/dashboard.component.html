<!--
      Dashboard content
      - space-y-6: Adds 24px vertical spacing between children
    -->
<div class="space-y-6">
  <!-- Page header -->
  <div class="flex items-center justify-between">
    <div>
      <!--
            - text-3xl: Large text size (30px)
            - font-bold: Bold font weight (700)
            - text-white: White color
          -->
      <h1 class="text-3xl font-bold text-white">Dashboard</h1>
      <!--
            - text-slate-400: Medium-light slate color
            - text-sm: Small text (14px)
            - mt-1: Margin-top of 4px
          -->
      <p class="text-slate-400 text-sm mt-1">Welcome back, Tom!</p>
    </div>
  </div>

  <!-- Stats cards grid -->
  <!--
        - grid: CSS Grid layout
        - grid-cols-1: 1 column on mobile
        - md:grid-cols-3: 3 columns on medium screens and up
        - gap-6: Gap of 24px between grid items
      -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Card 1 -->
    <!--
          - bg-slate-900: Dark background
          - rounded-lg: Large border radius (8px)
          - p-6: Padding of 24px
          - border: Border on all sides
          - border-slate-800: Dark slate border color
          - hover:border-slate-700: Lighter border on hover
          - transition-colors: Smooth color transition
        -->
    <div
      class="bg-slate-900 rounded-lg p-6 border border-slate-800 hover:border-slate-700 transition-colors"
    >
      <div class="flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-sm font-medium">Total Projects</p>
          <p class="text-white text-2xl font-bold mt-2">24</p>
        </div>
        <div class="w-12 h-12 bg-blue-600/10 rounded-lg flex items-center justify-center">
          <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div
      class="bg-slate-900 rounded-lg p-6 border border-slate-800 hover:border-slate-700 transition-colors"
    >
      <div class="flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-sm font-medium">Team Members</p>
          <p class="text-white text-2xl font-bold mt-2">48</p>
        </div>
        <div class="w-12 h-12 bg-green-600/10 rounded-lg flex items-center justify-center">
          <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div
      class="bg-slate-900 rounded-lg p-6 border border-slate-800 hover:border-slate-700 transition-colors"
    >
      <div class="flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-sm font-medium">Completed Tasks</p>
          <p class="text-white text-2xl font-bold mt-2">142</p>
        </div>
        <div class="w-12 h-12 bg-purple-600/10 rounded-lg flex items-center justify-center">
          <svg
            class="w-6 h-6 text-purple-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Recent activity section -->
  <div class="bg-slate-900 rounded-lg border border-slate-800">
    <div class="p-6 border-b border-slate-800">
      <h2 class="text-xl font-semibold text-white">Recent Activity</h2>
    </div>
    <div class="p-6">
      <p class="text-slate-400 text-center py-8">No recent activity to display</p>
    </div>
  </div>
</div>
